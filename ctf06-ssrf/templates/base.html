<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Preview{% endblock %} · CTF 06</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="badge">CTF 06 · médio</span>
      <h1>URL Preview</h1>
      <p class="muted">Cole uma URL e o servidor buscará o conteúdo para você.</p>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
      Ambiente de laboratório · não use em produção
    </footer>
  </main>
</body>
</html>
