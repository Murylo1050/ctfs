<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetCheck{% endblock %} · CTF 04</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="badge">CTF 04 · fácil</span>
      <h1>NetCheck</h1>
      <p class="muted">Diagnóstico de rede. O servidor executa a consulta e devolve a saída.</p>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
      Ambiente de laboratório · não use em produção
    </footer>
  </main>
</body>
</html>
