{% extends "base.html" %}

{% block title %}Painel administrativo{% endblock %}

{% block content %}
  <section class="result success">
    <span class="badge badge-success">ADMIN</span>
    <h2>Bem-vindo, {{ user.name }}!</h2>
    <p>Você alterou um campo que não deveria ser controlado pelo cliente. A flag é:</p>
    <code class="flag">{{ flag }}</code>
  </section>

  <p class="actions">
    <a class="link" href="{{ url_for('profile') }}">Voltar ao perfil</a>
    · <a class="link" href="{{ url_for('logout') }}">Sair</a>
  </p>
{% endblock %}
