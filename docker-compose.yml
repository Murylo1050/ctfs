name: minicurso-ctf-web

services:
  ctf01-cookie:
    build:
      context: ./ctf01-cookie
    container_name: ctf01-cookie
    environment:
      FLAG: "flag{c00k13s_s4o_cr0c4nt3s}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ctf02-sqli:
    build:
      context: ./ctf02-sqli
    container_name: ctf02-sqli
